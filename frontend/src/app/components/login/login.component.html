<app-navbar></app-navbar>

<section class="login-block">
    <div class="container">
        <div class="row">
            <div class="col-6 login-sec">
                <h2 class="text-center">Login Now</h2>
                <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">
                    <div class="form-group">
                        <label for="exampleInputEmail1" class="text-uppercase">Email</label>
                        <input type="email" class="form-control" placeholder="" formControlName="email">

                    </div>
                    <div class="form-group">
                        <label for="exampleInputPassword1" class="text-uppercase">Password</label>
                        <input type="password" class="form-control" placeholder="" formControlName="password">
                    </div>


                    <div class="form-check mt-2">
                        <label class="form-check-label">
                            <input type="checkbox" class="form-check-input " formControlName="isMedecin" >
                            <small class="mx-2">Vous etes Medecin</small>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-login float-right mt-5">Log IN</button>


                </form>
            </div>
            <div class="col-6 ">
                <img class="img1" src="../../../assets/images/medecin.png" alt="">
            </div>
        </div>
    </div>
</section>

<app-footer></app-footer>
