<app-navbar></app-navbar>




<div class="row m-3" >


<div class="container col-8 ">
  <!-- FORMULAIRE -->
  <div class="form-section ">
    <h2>Contactez Nous</h2>
    <div class="section-line"></div>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="nom">Nom/Prenom *</label>
        <input type="text" id="nom" formControlName="nom" [class.invalid]="isInvalid('nom')" />
        @if (isInvalid('nom')) {
        <span class="error">Ce champ est requis</span>
        }
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" formControlName="email" [class.invalid]="isInvalid('email')" />
        @if (isInvalid('email')) {
        <span class="error">Email invalide</span>
        }
      </div>

      <div class="form-group">
        <label for="sujet">Sujet *</label>
        <input type="text" id="sujet" formControlName="sujet" [class.invalid]="isInvalid('sujet')" />
        @if (isInvalid('sujet')) {
        <span class="error">Ce champ est requis</span>
        }
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" formControlName="message" [class.invalid]="isInvalid('message')"></textarea>
        @if (isInvalid('message')) {
        <span class="error">Ce champ est requis</span>
        }
      </div>

      <button type="submit">Envoyer</button>

    </form>
  </div>
  <!-- ADRESSE -->
  <div class="adresse-section">
    <h2>Adresse</h2>
    <div class="section-line"></div>

    <div class="info-list">
      @for (info of adresseInfos; track info.text) {
      <div class="info-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path [attr.d]="info.iconPath" />
          </svg>
        </div>
        <span>{{ info.text }}</span>
      </div>
      }
    </div>

  </div>






</div>

<div class="col-4">
  <div class="col text-center ">
        <img class="img1" src="../../../../assets/images/medecin.png" alt="">
    </div>
</div>
</div>

<app-footer></app-footer>
